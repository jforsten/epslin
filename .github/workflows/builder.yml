# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  # Native Windows build (no Cygwin, no cygwin1.dll), cross-compiled with
  # MinGW-w64 in Linux.
  win:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: building
        run: |
          set -e
          # Only the win32-threads compiler (EpsLin uses no threads): half
          # the download of gcc-mingw-w64-x86-64, which installs both
          # variants. Timeout + retries: the Ubuntu mirror can be slow.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get update -q $APT_OPTS
          sudo apt-get install -y -q --no-install-recommends $APT_OPTS gcc-mingw-w64-x86-64-win32
          wget -q --timeout=30 --tries=3 https://simonowen.com/fdrawcmd/fdrawcmd.h
          x86_64-w64-mingw32-gcc-win32 -static EpsLin.c -o epslin.exe
          x86_64-w64-mingw32-objdump -p epslin.exe | grep "DLL Name"
          zip epslin-win.zip epslin.exe
      - uses: actions/upload-artifact@v4
        with:
          path: ./epslin-win.zip
          name: epslin-win
  mac:
    runs-on: macOS-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          gcc EpsLin.c -o epslin
          zip ./epslin-osx.zip ./epslin
      - uses: actions/upload-artifact@v4
        with:
          path: ./epslin-osx.zip
          name: epslin-osx
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          gcc EpsLin.c -o epslin
          zip ./epslin-linux.zip ./epslin
      - uses: actions/upload-artifact@v4
        with:
          path: ./epslin-linux.zip
          name: epslin-linux
  release:
    # Only for pushes to master: pull requests are built, not released.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [win, mac, linux]
    steps:
    - uses: actions/checkout@v4
    - name: Get current date
      id: date
      run: echo "MY_DATE=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
      with:
        tag_name: ${{ env.MY_DATE }}
        release_name: Release ${{ env.MY_DATE }}
        body: |
          Latest release
        draft: false
        prerelease: false
    - uses: actions/download-artifact@v4
    - name: Print dir  
      run: |
          tree
    
    - name: Upload Release Asset win
      id: upload-release-asset-win
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        asset_path: /home/runner/work/epslin/epslin/epslin-win/epslin-win.zip
        asset_name: epslin-win.zip
        asset_content_type: application/octet-stream

    - name: Upload Release Asset osx
      id: upload-release-asset-osx
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        asset_path: /home/runner/work/epslin/epslin/epslin-osx/epslin-osx.zip
        asset_name: epslin-osx.zip
        asset_content_type: application/octet-stream
  
    - name: Upload Release Asset linux
      id: upload-release-asset-linux
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
        asset_path: /home/runner/work/epslin/epslin/epslin-linux/epslin-linux.zip
        asset_name: epslin-linux.zip
        asset_content_type: application/octet-stream
          
